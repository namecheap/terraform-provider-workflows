name: PR Title Check

# Requires a Conventional Commit PR title. PRs are squash-merged, so the title
# becomes the commit subject that release-please reads to pick the next
# version and write the changelog. Called from each repository's
# pr-title.yml; the caller grants pull-requests: read.
on:
  workflow_call:

jobs:
  conventional-title:
    name: Conventional PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            perf
            build
            revert
