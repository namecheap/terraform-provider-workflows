name: Security scan

# Trivy and govulncheck gates for a Terraform provider, plus an optional
# non-gating summary. Called from each provider's CI; see README.md.
#
# No `permissions:` here: the caller grants contents: read, plus
# pull-requests: write and security-events: read when `report` is on.
on:
  workflow_call:
    inputs:
      trivy:
        description: Gate on Trivy vulnerability, misconfiguration, secret and license findings.
        type: boolean
        default: true
      trivy-config:
        description: Trivy config file (license denylist), relative to working-directory.
        type: string
        default: trivy.yaml
      govulncheck:
        description: Gate on Go vulnerabilities reachable from the module's code.
        type: boolean
        default: true
      report:
        description: Publish a non-gating summary (all-severity results, SBOM, open CodeQL alerts) to the job summary and a sticky PR comment.
        type: boolean
        default: false
      working-directory:
        description: Directory containing go.mod.
        type: string
        default: "."
    outputs:
      summary-source:
        description: Repository and commit the summary script was taken from (empty when report is off).
        value: ${{ jobs.report.outputs.summary-source }}

jobs:
  trivy:
    name: Security scan (Trivy)
    if: inputs.trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy reads Go module licenses from the module cache. Without the
      # download every license is unknown and the license denylist never fires.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: false

      - name: Download Go modules
        working-directory: ${{ inputs.working-directory }}
        run: go mod download

      # Dependabot bumps the action, not `version:`; bump it by hand, together
      # with the release SBOM's in release.yml.
      - name: Trivy vuln + misconfig + secret + license scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: vuln,misconfig,secret,license
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivy-config: ${{ inputs.working-directory }}/${{ inputs.trivy-config }}
          cache: "true"

      # All severities, never gates; feeds the summary.
      - name: Trivy report (JSON, all severities, non-gating)
        if: ${{ inputs.report && !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          scanners: vuln,misconfig,secret,license
          exit-code: "0"
          format: json
          output: trivy-results.json
          trivy-config: ${{ inputs.working-directory }}/${{ inputs.trivy-config }}
          cache: "true"

      - name: Upload Trivy JSON report
        if: ${{ inputs.report && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-json
          path: trivy-results.json
          retention-days: 90

      - name: Generate CycloneDX SBOM
        if: ${{ inputs.report && !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          format: cyclonedx
          output: sbom.cdx.json
          cache: "true"

      - name: Upload SBOM artifact
        if: ${{ inputs.report && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  govulncheck:
    name: Security scan (govulncheck)
    if: inputs.govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # go.mod's version (its `toolchain` line when present) is the one
      # releases build with, so stdlib advisories match what ships.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          check-latest: true
          cache: false

      # Not in go.mod, so Dependabot doesn't track it; bump by hand. Fails only
      # on vulnerabilities in called code.
      - name: Run govulncheck
        working-directory: ${{ inputs.working-directory }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Never gates; feeds the summary.
      - name: govulncheck JSON report (non-gating)
        if: ${{ inputs.report && !cancelled() }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          "$(go env GOPATH)/bin/govulncheck" -format json ./... > "$GITHUB_WORKSPACE/govulncheck.json" || true

      - name: Upload govulncheck JSON report
        if: ${{ inputs.report && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-json
          path: govulncheck.json
          retention-days: 90

  # Reporting only: the gates are the two jobs above, whose results the
  # summary shows as they are.
  report:
    name: Security scan summary
    needs: [trivy, govulncheck]
    if: ${{ !cancelled() && inputs.report }}
    runs-on: ubuntu-latest
    outputs:
      summary-source: ${{ steps.source.outputs.summary-source }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script comes from this workflow's own repository and commit (the
      # SHA the caller pinned), not from the caller's checkout.
      - name: Check out the summary script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .security-scan
          sparse-checkout: scripts/security-summary.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Record the script source
        id: source
        env:
          SOURCE: ${{ job.workflow_repository }}@${{ job.workflow_sha }}
        run: |
          echo "summary script from ${SOURCE}"
          echo "summary-source=${SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Download scan artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{trivy-json,govulncheck-json,sbom-cyclonedx}"
          path: scan-artifacts
          merge-multiple: true

      # Best effort: no code scanning, or an analysis not finished for this
      # ref, gives an empty list.
      - name: Fetch open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scan-artifacts
          gh api "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${GITHUB_REF}&state=open&per_page=100" \
            > scan-artifacts/codeql-alerts.json 2>/dev/null || echo '[]' > scan-artifacts/codeql-alerts.json

      - name: Build security summary
        env:
          SECURITY_RESULT: ${{ needs.trivy.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          bash .security-scan/scripts/security-summary.sh \
            scan-artifacts/trivy-results.json \
            scan-artifacts/govulncheck.json \
            scan-artifacts/sbom.cdx.json \
            "$WORKING_DIRECTORY/go.mod" \
            scan-artifacts/codeql-alerts.json \
            > security-summary.md
          cat security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90

      # Skipped where the token is read-only: Dependabot and fork PRs.
      - name: Post or update PR comment
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          marker='<!-- security-scan-summary -->'
          pr="${EVENT_PR_NUMBER:-}"
          if [ -z "${pr}" ]; then
            pr="$(gh pr list --head "${GITHUB_REF_NAME}" --state open \
                    --json number --jq '.[0].number // empty')"
          fi
          if [ -z "${pr}" ]; then
            echo "No open PR for branch ${GITHUB_REF_NAME}; summary is on the job summary + artifact only."
            exit 0
          fi
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments?per_page=100" \
                        --jq "map(select(.body | startswith(\"${marker}\"))) | .[0].id // empty")"
          jq -Rs '{body: .}' security-summary.md > comment-payload.json
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              --input comment-payload.json >/dev/null
            echo "Updated existing summary comment #${existing} on PR #${pr}."
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
              --input comment-payload.json >/dev/null
            echo "Posted new summary comment on PR #${pr}."
          fi
