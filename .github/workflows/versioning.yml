name: Versioning

# Runs release-please, which opens and updates the Release PR and, once that
# PR is merged, creates the vX.Y.Z tag that starts the caller's release.yml.
# Called from each provider's versioning.yml after CI succeeds on the default
# branch, or by manual dispatch.
on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the GitHub App that release-please acts as.
        type: string
        required: true
    secrets:
      app-private-key:
        description: Private key of that GitHub App.
        required: true

jobs:
  release-please:
    name: Release Please
    # workflow_run fires for failed CI runs too, hence the conclusion check.
    # Its branch filter matches the run's head branch name, which a fork PR
    # can spoof by naming its branch like the default branch, hence the
    # head_repository check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Every write goes through the App token: tags and PRs created with
    # GITHUB_TOKEN do not trigger other workflows, so the tag would never
    # start release.yml.
    permissions: {}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        # Narrow the token to what release-please needs, whatever else the
        # App installation is allowed to do.
        with:
          client-id: ${{ inputs.app-client-id }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.app-private-key }}

      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
